  # ---------------- Reports / Export / Trash ----------------
  /reports/costs:
    get:
      tags: [Reports]
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: horseIds
          in: query
          description: Pusty = wszystkie; wartość specjalna `general` = tylko zakupy ogólne
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: categories
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - { name: groupBy, in: query, schema: { type: string, enum: [horse, month, category], default: month } }
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostReport" }
  /reports/horse-balance:
    get:
      tags: [Reports]
      description: >
        Bilans konia (od 1.3): zakup, koszty z całej historii, nagrody, sprzedaż i wynik dla każdego konia spoza kosza.
        `result = (salePrice ?? 0) + prizes − (purchasePrice ?? 0) − costs`. Wartość konia (`estimatedValue`) jest tylko informacją.
      parameters:
        - name: status
          in: query
          description: Statusy konia po przecinku; brak = wszystkie
          style: form
          explode: false
          schema: { type: array, items: { $ref: "#/components/schemas/HorseStatus" } }
        - name: horseIds
          in: query
          description: Konie po przecinku; brak = wszystkie konie spoza kosza
          style: form
          explode: false
          schema: { type: array, items: { type: string, format: uuid } }
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HorseBalanceReport" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /reports/training-summary:
    get:
      tags: [Reports]
      description: >
        Podsumowanie treningów konia (od 1.3): statystyki min / średnia / maks. w podziale na rodzaj treningu i serie
        wykresu postępów dla wybranego okresu.
      parameters:
        - { name: horseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: range, in: query, schema: { type: string, enum: [week, month, year, all], default: month } }
        - { name: date, in: query, description: Dowolny dzień okresu; domyślnie dziś; ignorowany dla all, schema: { type: string, format: date } }
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrainingSummaryReport" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/rider-trainings:
    get:
      tags: [Reports]
      description: >
        Treningi jeźdźca (od 1.5): treningi jednego jeźdźca (`riderId`) albo wszystkich jeźdźców (brak `riderId`)
        w okresie, z podsumowaniem i podziałem na konie (jeden jeździec) albo na jeźdźców (wszyscy). Treningi bez jeźdźca
        i treningi z kosza są pomijane. `404`, gdy `riderId` lub `horseId` nie istnieje.
      parameters:
        - { name: riderId, in: query, description: Jeździec (kontakt); brak = wszyscy jeźdźcy, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/HorseId"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderTrainingsReport" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/rider-competitions:
    get:
      tags: [Reports]
      description: >
        Zawody jeźdźca (od 1.5): zawody ze startami jednego jeźdźca (`riderId`) albo wszystkich jeźdźców w okresie
        liczonym po dacie startu (`startDate`, a gdy brak — pierwszy dzień zawodów). `costs = entryFee + otherCosts`,
        `prizes = prizeMoney`, `balance = prizes − costs`. Starty bez jeźdźca i z kosza są pomijane. `404`, gdy `riderId`
        lub `horseId` nie istnieje.
      parameters:
        - { name: riderId, in: query, description: Jeździec (kontakt); brak = wszyscy jeźdźcy, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/HorseId"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderCompetitionsReport" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
  /export:
    get:
      tags: [Export]
      summary: Eksport JSON (bez plików załączników) — schemat 1.4 albo 1.5
      description: >
        Odpowiedź jest strumieniowana; parametry są sprawdzane przed pierwszym bajtem. Schemat odpowiedzi: bez `updatedSince` i bez cechy
        `horse-status-injured` — 1.4 (koń `Injured` zapisany jako `Active`, bez zmian względem 1.6.1); z cechą — 1.5; z `updatedSince` — 1.5
        (`Injured` tylko z cechą).
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [full, horse], default: full } }
        - { name: horseId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/UpdatedSince"
        - $ref: "#/components/parameters/ClientFeatures"
      responses:
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: >
            Plik eksportu. Z `updatedSince`: `data` ma tylko rekordy zmienione od tej chwili (włącznie), `trashed[]` — przeniesione do kosza,
            `purged[]` — trwale usunięte; `scope.nextUpdatedSince` to wartość do następnego żądania. `scope.fullRequired: true` — `updatedSince`
            jest wcześniejsze niż linia bazowa (migracja 2.0.0, import, przywrócenie kopii, ponad 90 dni): `data` zawiera pełny eksport, klient zastępuje całą kopię.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "./export-schema-1.4.json" }
                  - { $ref: "./export-schema-1.5.json" }
  /trash:
    get:
      tags: [Trash]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TrashItem" } }
  /trash/{type}/{id}/restore:
    parameters:
      - { name: type, in: path, required: true, schema: { type: string } }
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Trash]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204": { description: Przywrócono (cały batch) }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  headers:
    ETag:
      description: Wersja rekordu, np. `"3"`
      schema: { type: string }
    Location:
      schema: { type: string }
    RetryAfter:
      description: Liczba sekund, po których można ponowić żądanie
      schema: { type: integer, minimum: 1 }
    IdempotentReplayed:
      description: Od 2.0. `true` — odpowiedź zapamiętana z pierwszego żądania z tym `Idempotency-Key`; nowy rekord nie powstał
      schema: { type: string, enum: ["true"] }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HorseId: { name: horseId, in: query, schema: { type: string, format: uuid } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    Q: { name: q, in: query, description: Wyszukiwanie tekstowe, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Sort: { name: sort, in: query, description: "Pole sortowania, prefiks `-` = malejąco, np. `-date`", schema: { type: string } }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Wersja rekordu, np. `"5"` lub `W/"5"`. Przy `PUT` — jak dotąd. Od 2.0 także przy `DELETE` i `POST /trash/{type}/{id}/restore` (wersja korzenia partii):
        zgodna → wykonane, niezgodna → `409` z aktualnym rekordem i `ETag`, rekord nietknięty; nieczytelna → `400` (`errors.If-Match`); brak → bez sprawdzenia.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Od 2.0. 8–64 znaków `[A-Za-z0-9_-]` (inaczej `400`, `errors.Idempotency-Key`). Pierwsze żądanie zakończone `2xx` jest zapamiętane na 7 dni
        (klucz API + klucz + skrót metody, ścieżki i treści). Powtórzenie z tą samą treścią zwraca zapamiętany status, `Location` i treść z nagłówkiem
        `Idempotent-Replayed: true` bez tworzenia nowego rekordu; z inną treścią → `422`; w toku → `409`; pierwsze żądanie zakończone `4xx/5xx` nie jest zapamiętywane.
      schema: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9_-]{8,64}$" }
    ClientFeatures:
      name: X-Client-Features
      in: header
      required: false
      description: >
        Od 2.0. Lista cech klienta po przecinku (bez rozróżniania wielkości liter, nieznane wartości ignorowane). `horse-status-injured` — klient zna status konia `Injured`.
      schema: { type: string, example: horse-status-injured }
    UpdatedSince:
      name: updatedSince
      in: query
      description: >
        Od 2.0. Eksport przyrostowy: chwila graniczna ISO 8601 z `Z` albo przesunięciem (`2026-10-14T08:30:00Z`), włącznie. Tylko z `scope=full`
        (`scope=horse` → `400`); nieprawidłowa wartość → `400` (`errors.updatedSince`) przed pierwszym bajtem. Z przyszłości → pusta różnica.
      schema: { type: string, format: date-time }
    DictionaryTypePath:
      name: type
      in: path
      required: true
      schema: { $ref: "#/components/schemas/DictionaryType" }

  responses:
    Unauthorized:
      description: Brak lub nieprawidłowy klucz API
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    KeyHomeOnly:
      description: >
        Klucz nie ma zgody na dostęp spoza sieci domowej (tylko żądania z adresów zdalnych, od 1.2).
        `type` = `https://zarzadzanie-konmi/errors/key-home-only`, `title` = „Ten klucz działa tylko w sieci domowej”.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    TooManyRequests:
      description: >
        Przekroczony limit żądań (100 / 10 s na klucz; 10/min bez klucza z adresu zdalnego) albo adres zdalny
        zablokowany po nieudanych próbach (od 1.2). Nagłówek `Retry-After` podaje liczbę sekund do ponowienia.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    NotFound:
      description: Nie znaleziono (lub w koszu)
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    ValidationError:
      description: Błąd walidacji
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/ValidationProblem" } }
    Conflict:
      description: >
        Konflikt wersji / unikalności / użycia. Przy konflikcie wersji `current` zawiera aktualny rekord (także przy `DELETE` z `If-Match`; nagłówek `ETag`
        z aktualną wersją). Przy przywracaniu z niezgodnym `If-Match` treścią jest `TrashItem` partii z `rootVersion` i `ETag: "<rootVersion>"`.
        Od 2.0 także `type` = `https://zarzadzanie-konmi/errors/idempotency-key-in-progress`: pierwsze żądanie z tym `Idempotency-Key` jest w toku — klient ponawia.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/ConflictProblem" } }
    Problem:
      description: Błąd
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    IdempotencyKeyReused:
      description: >
        Od 2.0. `Idempotency-Key` użyty wcześniej z inną treścią żądania.
        `type` = `https://zarzadzanie-konmi/errors/idempotency-key-reused`.
      content:
        application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } }
    HorseCreated:
      description: Utworzono
      headers:
        Location: { $ref: "#/components/headers/Location" }
        Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
      content:
        application/json: { schema: { $ref: "#/components/schemas/Horse" } }

  schemas:
    # ---- common ----
    Uuid: { type: string, format: uuid }
    Money: { type: number, minimum: 0, maximum: 10000000, multipleOf: 0.01 }
    Audit:
      type: object
      required: [id, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        version: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    VersionField:
      type: object
      properties:
        version: { type: integer, description: Wymagane przy PUT, jeśli brak nagłówka If-Match }
    ForeignAmount:
      type: object
      properties:
        originalAmount: { type: [number, "null"] }
        originalCurrency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
    NextVisit:
      type: object
      properties:
        nextVisitDate: { type: [string, "null"], format: date }
        nextVisitPurpose: { type: [string, "null"], maxLength: 200 }
    PageMeta:
      type: object
      required: [page, pageSize, totalCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties: { type: array, items: { type: string } }
            warnings:
              type: object
              additionalProperties: { type: array, items: { type: string } }
    ConflictProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            reason: { type: string, enum: [VersionMismatch, Unique, InUse, InvalidState] }
            current: { type: object, description: Aktualna wersja rekordu (dla VersionMismatch) }

    SystemInfo:
      type: object
      required: [appVersion, apiVersion, schemaVersion, serverTime, capabilities, dataStamp]
      properties:
        appVersion: { type: string, example: "2.0.0" }
        apiVersion: { type: string, const: v1 }
        schemaVersion: { type: string, description: Najnowszy schemat eksportu programu (od 2.0 `1.5`), example: "1.5" }
        serverTime: { type: string, format: date-time }
        capabilities:
          type: array
          description: >
            Od 2.0. Rozszerzenia, które działają w tej instalacji. Klient włącza obejścia tylko dla brakujących nazw.
          items:
            type: string
            enum: [updatedSince, ifMatchDelete, idempotencyKey, horsePhotoField, dataStamp, horseStatusInjured]
          example: [updatedSince, ifMatchDelete, idempotencyKey, horsePhotoField, dataStamp, horseStatusInjured]
        dataStamp:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: >
            Od 2.0. Znacznik danych: zmienia się po każdym zatwierdzonym zapisie (dodanie, edycja, kosz, przywrócenie, trwałe usunięcie,
            import, przywrócenie kopii); nie zmienia się po odczytach ani po ponownym uruchomieniu programu. Nie ujawnia treści danych.
          example: 9f2c1a7be04d33c1

    # ---- enums ----
    HorseStatus:
      type: string
      enum: [Active, Sold, Deceased, Leased, Injured]
      description: >
        `Injured` („Kontuzjowany”, od 2.0) widzą tylko klienci z nagłówkiem `X-Client-Features: horse-status-injured`;
        pozostałym koń kontuzjowany jest pokazywany jako `Active`, a zapis `Active` przez takiego klienta nie zmienia statusu `Injured` (bez `409`).
    HorseSex: { type: string, enum: [Mare, Stallion, Gelding] }
    ContactType: { type: string, enum: [Vet, Farrier, Physio, Specialist, Shop, Organizer, Other, Trainer, Rider] }
    DictionaryType:
      type: string
      enum: [VetVisitType, FarrierService, PhysioBodyArea, PhysioTechnique, SpecialistType, CompetitionRank, CompetitionDiscipline, PurchaseCategory, Unit, TrainingType]
    ReminderKind: { type: string, enum: [Vet, Vaccination, Deworming, Farrier, Physio, Specialist, Competition, Other] }
    ReminderStatus: { type: string, enum: [Open, Completed, Dismissed] }
    PurchaseAssignment: { type: string, enum: [SingleHorse, MultipleHorses, General] }
    ResultStatus: { type: [string, "null"], enum: [Completed, Eliminated, Retired, DidNotStart, null] }
    MedicationAdministration: { type: [string, "null"], enum: [AdministeredAtVisit, Prescribed, null] }
    AttachmentOwnerType:
      type: string
      enum: [Horse, VetVisit, FarrierVisit, PhysioVisit, SpecialistVisit, Competition, CompetitionStart, Purchase, Note, Contact]
    TimelineEntryType:
      type: string
      enum: [VetVisit, FarrierVisit, PhysioVisit, SpecialistVisit, CompetitionStart, Purchase, Note]

    # ---- horse ----
    HorseFinance:
      type: object
      description: >
        Zakup, sprzedaż i wartość konia (od 1.3). Wszystkie pola nieobowiązkowe; null ≠ 0. Wartość konia to ocena własna
        właściciela i nie wchodzi do żadnych sum. Kwoty w PLN (≥ 0, maks. 2 miejsca po przecinku), daty nie z przyszłości.
      properties:
        purchasePrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        purchaseDate: { type: [string, "null"], format: date }
        salePrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        saleDate: { type: [string, "null"], format: date }
        estimatedValue: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
    HorseInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: Dla źrebaka bez numeru paszportu unikalne (bez względu na wielkość liter) wśród innych źrebiąt bez paszportu spoza kosza (409 Unique) — od 1.1
        passportNumber:
          type: [string, "null"]
          maxLength: 50
          description: >
            Nieobowiązkowy w schemacie (od 1.1). Wymagalność sprawdza serwis aplikacji:
            wymagany, gdy isFoal = false (400, errors.passportNumber). Unikalny wśród wpisanych numerów koni spoza kosza (409 Unique).
        isFoal: { type: boolean, default: false, description: Źrebak — zdejmuje wymagalność numeru paszportu (od 1.1) }
        stableName: { type: [string, "null"], maxLength: 100 }
        ueln: { type: [string, "null"], maxLength: 15 }
        microchipNumber: { type: [string, "null"], maxLength: 20 }
        passportIssuer: { type: [string, "null"], maxLength: 150 }
        passportIssueDate: { type: [string, "null"], format: date }
        breed: { type: [string, "null"], maxLength: 100 }
        sex: { oneOf: [{ $ref: "#/components/schemas/HorseSex" }, { type: "null" }] }
        color: { type: [string, "null"], maxLength: 50 }
        birthDate: { type: [string, "null"], format: date }
        birthYearOnly: { type: boolean, default: false }
        birthCountry: { type: [string, "null"], maxLength: 100 }
        sire: { type: [string, "null"], maxLength: 100 }
        dam: { type: [string, "null"], maxLength: 100 }
        damSire: { type: [string, "null"], maxLength: 100 }
        breeder: { type: [string, "null"], maxLength: 200 }
        owner: { type: [string, "null"], maxLength: 200 }
        markings: { type: [string, "null"] }
        photoAttachmentId:
          type: [string, "null"]
          format: uuid
          description: >
            Od 2.0, zdjęcie główne konia. `PUT`: brak pola = zdjęcie bez zmiany (klient 1.x); `null` = brak zdjęcia (załącznik zostaje w galerii);
            identyfikator = ustaw zdjęcie (załącznik musi należeć do tego konia i być obrazem → `400`, `errors.photoAttachmentId`;
            nieistniejący lub w koszu → `404`). Zmiana zdjęcia podbija `version` konia. `POST`: tylko brak lub `null`, inaczej `400`.
        farrierIntervalWeeks: { type: integer, minimum: 1, maximum: 26 }
        status: { $ref: "#/components/schemas/HorseStatus" }
        statusDate: { type: [string, "null"], format: date }
        statusNote: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        finance:
          oneOf: [{ $ref: "#/components/schemas/HorseFinance" }, { type: "null" }]
          description: >
            Od 1.3. Przy tworzeniu brak = bez kwot. Przy PUT brak (albo null) = pola finansowe bez zmian (klient 1.2);
            obecny obiekt zastępuje pięć pól, null w polu czyści wartość. Zmiana statusu na Deceased ustawia
            salePrice = 0 i saleDate = statusDate, także gdy żądanie niesie inną cenę sprzedaży.
    HorseUpdate:
      allOf:
        - $ref: "#/components/schemas/HorseInput"
        - $ref: "#/components/schemas/VersionField"
    Horse:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/HorseInput"
        - type: object
          properties:
            nextReminder: { oneOf: [{ $ref: "#/components/schemas/Reminder" }, { type: "null" }], readOnly: true }
            monthsWithoutPassport:
              type: [integer, "null"]
              readOnly: true
              description: Pełne miesiące od daty urodzenia dla źrebaka bez paszportu; null w pozostałych przypadkach (od 1.1)
    HorsePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/HorseListItem" } }

    TimelineItem:
      type: object
      required: [entryType, id, date, title]
      properties:
        entryType: { $ref: "#/components/schemas/TimelineEntryType" }
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        title: { type: string }
        summary: { type: [string, "null"] }
        cost: { type: [number, "null"] }
        attachmentCount: { type: integer }
    TimelinePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }

    # ---- vet ----
    VetMedication:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 200 }
        dosage: { type: [string, "null"], maxLength: 200 }
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
        administration: { $ref: "#/components/schemas/MedicationAdministration" }
        notes: { type: [string, "null"] }
    VetVisitInput:
      allOf:
        - type: object
          required: [horseId, visitDateTime, visitTypeId]
          properties:
            horseId: { type: string, format: uuid }
            visitDateTime: { type: string, format: date-time }
            contactId: { type: [string, "null"], format: uuid }
            visitTypeId: { type: string, format: uuid }
            reason: { type: [string, "null"] }
            diagnosis: { type: [string, "null"] }
            recommendations: { type: [string, "null"] }
            vaccineOrProduct: { type: [string, "null"], maxLength: 200 }
            batchNumber: { type: [string, "null"], maxLength: 50 }
            cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
            medications: { type: array, items: { $ref: "#/components/schemas/VetMedication" } }
        - $ref: "#/components/schemas/ForeignAmount"
        - $ref: "#/components/schemas/NextVisit"
    VetVisit:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/VetVisitInput"
        - type: object
          properties:
            reminderId: { type: [string, "null"], format: uuid, readOnly: true }

    # ---- farrier ----
    FarrierVisitInput:
      allOf:
        - type: object
          required: [horseId, visitDate, serviceId]
          properties:
            horseId: { type: string, format: uuid }
            visitDate: { type: string, format: date }
            contactId: { type: [string, "null"], format: uuid }
            serviceId: { type: string, format: uuid }
            hoofNotes: { type: [string, "null"] }
            cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
            nextVisitDate: { type: [string, "null"], format: date }
        - $ref: "#/components/schemas/ForeignAmount"
    FarrierVisit:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/FarrierVisitInput"
        - type: object
          properties:
            reminderId: { type: [string, "null"], format: uuid, readOnly: true }

    # ---- physio ----
    PhysioVisitInput:
      allOf:
        - type: object
          required: [horseId, visitDate]
          properties:
            horseId: { type: string, format: uuid }
            visitDate: { type: string, format: date }
            contactId: { type: [string, "null"], format: uuid }
            reason: { type: [string, "null"] }
            bodyAreaIds: { type: array, items: { type: string, format: uuid } }
            techniqueIds: { type: array, items: { type: string, format: uuid } }
            observations: { type: [string, "null"] }
            recommendations: { type: [string, "null"] }
            cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        - $ref: "#/components/schemas/ForeignAmount"
        - $ref: "#/components/schemas/NextVisit"
    PhysioVisit:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/PhysioVisitInput"
        - type: object
          properties:
            reminderId: { type: [string, "null"], format: uuid, readOnly: true }

    # ---- specialist ----
    SpecialistVisitInput:
      allOf:
        - type: object
          required: [horseId, visitDate, specialistTypeId]
          properties:
            horseId: { type: string, format: uuid }
            visitDate: { type: string, format: date }
            specialistTypeId: { type: string, format: uuid }
            contactId: { type: [string, "null"], format: uuid }
            reason: { type: [string, "null"] }
            description: { type: [string, "null"] }
            recommendations: { type: [string, "null"] }
            cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        - $ref: "#/components/schemas/ForeignAmount"
        - $ref: "#/components/schemas/NextVisit"
    SpecialistVisit:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/SpecialistVisitInput"
        - type: object
          properties:
            reminderId: { type: [string, "null"], format: uuid, readOnly: true }

    # ---- competitions ----
    CompetitionInput:
      type: object
      required: [name, dateFrom]
      properties:
        name: { type: string, maxLength: 200 }
        dateFrom: { type: string, format: date }
        dateTo: { type: [string, "null"], format: date }
        city: { type: [string, "null"], maxLength: 100 }
        venue: { type: [string, "null"], maxLength: 200 }
        organizerContactId: { type: [string, "null"], format: uuid }
        rankId: { type: [string, "null"], format: uuid }
        disciplineId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }
    Competition:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/CompetitionInput"
        - type: object
          properties:
            starts: { type: array, items: { $ref: "#/components/schemas/CompetitionStart" }, readOnly: true }
    CompetitionStartInput:
      allOf:
        - type: object
          required: [horseId]
          properties:
            horseId: { type: string, format: uuid }
            startDate: { type: [string, "null"], format: date }
            disciplineId: { type: [string, "null"], format: uuid }
            className: { type: [string, "null"], maxLength: 100 }
            riderContactId: { type: [string, "null"], format: uuid, description: Kontakt typu Rider (od 1.5; zastępuje rider) }
            placement: { type: [integer, "null"], minimum: 1 }
            participantsCount: { type: [integer, "null"], minimum: 1 }
            resultStatus: { $ref: "#/components/schemas/ResultStatus" }
            penaltyPoints: { type: [number, "null"], minimum: 0 }
            scorePercent: { type: [number, "null"], minimum: 0, maximum: 100 }
            timeSeconds: { type: [number, "null"], exclusiveMinimum: 0 }
            description: { type: [string, "null"] }
            subjectiveRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
            entryFee: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
            otherCosts: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
            prizeMoney: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        - $ref: "#/components/schemas/ForeignAmount"
    CompetitionStart:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/CompetitionStartInput"
        - type: object
          properties:
            competitionId: { type: string, format: uuid, readOnly: true }
            riderName: { type: [string, "null"], readOnly: true, description: Nazwa kontaktu jeźdźca (od 1.5) }
    CompetitionStats:
      type: object
      properties:
        starts: { type: integer }
        wins: { type: integer }
        podiums: { type: integer }
        averageRating: { type: [number, "null"] }
        totalPrizeMoney: { type: number }
        totalCosts: { type: number }

    # ---- purchases ----
    PurchaseInput:
      allOf:
        - type: object
          required: [purchaseDate, productName, categoryId, totalAmount, assignment]
          properties:
            purchaseDate: { type: string, format: date }
            productName: { type: string, maxLength: 200 }
            categoryId: { type: string, format: uuid }
            supplierContactId: { type: [string, "null"], format: uuid }
            quantity: { type: [number, "null"], exclusiveMinimum: 0 }
            unitId: { type: [string, "null"], format: uuid }
            unitPrice: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
            totalAmount:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: Kwota zakupu bez kosztu dostawy
            deliveryCost:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              default: 0
              description: Koszt dostawy w PLN (≥ 0); nieobowiązkowy w żądaniu — brak = 0; w odpowiedzi zawsze liczba (od 1.1)
            assignment: { $ref: "#/components/schemas/PurchaseAssignment" }
            horseIds:
              type: array
              items: { type: string, format: uuid }
              description: "SingleHorse: 1, MultipleHorses: ≥2, General: 0"
            notes: { type: [string, "null"] }
        - $ref: "#/components/schemas/ForeignAmount"
    Purchase:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/PurchaseInput"
        - type: object
          properties:
            totalCost:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              readOnly: true
              description: totalAmount + deliveryCost — kwota używana w raportach i podziale na konie (od 1.1)

    # ---- notes ----
    NoteInput:
      type: object
      required: [horseId, noteDate, title]
      properties:
        horseId: { type: string, format: uuid }
        noteDate: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        content: { type: [string, "null"] }
        isPinned: { type: boolean, default: false }
    Note:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/NoteInput"

    # ---- trainings ----
    TrainingIntensity: { type: string, enum: [Light, Medium, Hard] }
    TrainingInput:
      type: object
      required: [horseId, trainingDate, trainingTypeId]
      properties:
        horseId: { type: string, format: uuid }
        trainingDate: { type: string, format: date, description: Nie z przyszłości }
        trainingTypeId: { type: string, format: uuid, description: Pozycja słownika TrainingType }
        durationMinutes: { type: [integer, "null"], minimum: 1, maximum: 600 }
        intensity: { oneOf: [{ $ref: "#/components/schemas/TrainingIntensity" }, { type: "null" }] }
        obstacleHeightCm:
          type: [integer, "null"]
          minimum: 10
          maximum: 200
          description: Tylko dla rodzaju z systemKey training.jumping; przy innym rodzaju 400
        riderContactId:
          type: [string, "null"]
          format: uuid
          description: >
            Kontakt typu Rider (od 1.5; zastępuje rider). Zwykłe pole wpisu — PUT je zastępuje, brak lub null = bez
            jeźdźca; nie należy do coaching.
        rating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        description: { type: [string, "null"] }
        coaching:
          oneOf: [{ $ref: "#/components/schemas/TrainingCoaching" }, { type: "null" }]
          description: >
            Trener i koszt (od 1.4). Przy POST brak = bez trenera i kosztu. Przy PUT brak lub null = trener i koszt
            bez zmian; obiekt zastępuje wszystkie cztery pola (null czyści).
    TrainingCoaching:
      type: object
      properties:
        trainerContactId: { type: [string, "null"], format: uuid, description: Kontakt typu Trainer }
        cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "Łączny koszt treningu (trener, dojazd, hala)" }
        originalAmount: { type: [number, "null"], description: Kwota w walucie oryginalnej (informacyjnie) }
        originalCurrency: { type: [string, "null"], description: Kod ISO 4217 różny od PLN; razem z originalAmount albo wcale }
    Training:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/TrainingInput"
        - type: object
          properties:
            horseName: { type: string, readOnly: true }
            trainingTypeName: { type: string, readOnly: true }
            trainerName: { type: [string, "null"], readOnly: true }
            riderName: { type: [string, "null"], readOnly: true, description: Nazwa kontaktu jeźdźca (od 1.5) }

    # ---- reminders ----
    ReminderInput:
      type: object
      required: [horseId, kind, dueDate, title]
      properties:
        horseId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ReminderKind" }
        dueDate: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        specialistTypeId: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"] }
    Reminder:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/ReminderInput"
        - type: object
          properties:
            status: { $ref: "#/components/schemas/ReminderStatus" }
            sourceType: { type: [string, "null"] }
            sourceId: { type: [string, "null"], format: uuid }
            completedByType: { type: [string, "null"] }
            completedById: { type: [string, "null"], format: uuid }
            completedAt: { type: [string, "null"], format: date-time }
            isOverdue: { type: boolean, readOnly: true }
    Dashboard:
      type: object
      properties:
        overdue: { type: array, items: { $ref: "#/components/schemas/Reminder" } }
        upcoming: { type: array, items: { $ref: "#/components/schemas/Reminder" } }
        laterThisMonth: { type: array, items: { $ref: "#/components/schemas/Reminder" } }
        recentEntries: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
        costsThisMonth: { type: number }
        costsPreviousMonth: { type: number }
        horizonDays: { type: integer }

    # ---- contacts ----
    ContactInput:
      type: object
      required: [name, types]
      properties:
        name: { type: string, maxLength: 200 }
        types: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/ContactType" } }
        company: { type: [string, "null"], maxLength: 200 }
        phone: { type: [string, "null"], maxLength: 30 }
        email: { type: [string, "null"], format: email, maxLength: 150 }
        address: { type: [string, "null"] }
        specialization: { type: [string, "null"], maxLength: 200 }
        notes: { type: [string, "null"] }
        isArchived: { type: boolean, default: false }
    Contact:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - $ref: "#/components/schemas/ContactInput"

    # ---- elementy list (kształt z programu 1.6.1: GET /openapi/v1.json) ----
    # Listy zwracają skrócone elementy bez createdAt/updatedAt; pełny rekord daje GET .../{id}.
    HorseListItem:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        stableName: { type: [string, "null"] }
        passportNumber: { type: [string, "null"] }
        breed: { type: [string, "null"] }
        sex: { oneOf: [{ $ref: "#/components/schemas/HorseSex" }, { type: "null" }] }
        color: { type: [string, "null"] }
        ageYears: { type: [integer, "null"] }
        status: { $ref: "#/components/schemas/HorseStatus" }
        nextReminderDate: { type: [string, "null"], format: date }
        nextReminderTitle: { type: [string, "null"] }
        photoAttachmentId: { type: [string, "null"], format: uuid }
        isFoal: { type: boolean }
        monthsWithoutPassport: { type: [integer, "null"] }
    ContactListItem:
      type: object
      required: [id, version, name, types, isArchived]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        name: { type: string }
        types: { type: array, items: { $ref: "#/components/schemas/ContactType" } }
        company: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        isArchived: { type: boolean }
    VetVisitListItem:
      type: object
      required: [id, version, horseId, visitDateTime, visitTypeName, medicationCount]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        horseId: { type: string, format: uuid }
        visitDateTime: { type: string, format: date-time }
        visitTypeName: { type: string }
        visitTypeSystemKey: { type: [string, "null"] }
        contactName: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        cost: { type: [number, "null"] }
        nextVisitDate: { type: [string, "null"], format: date }
        medicationCount: { type: integer }
    FarrierVisitListItem:
      type: object
      required: [id, version, horseId, visitDate, serviceName]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        horseId: { type: string, format: uuid }
        visitDate: { type: string, format: date }
        serviceName: { type: string }
        contactName: { type: [string, "null"] }
        hoofNotes: { type: [string, "null"] }
        cost: { type: [number, "null"] }
        nextVisitDate: { type: [string, "null"], format: date }
    PhysioVisitListItem:
      type: object
      required: [id, version, horseId, visitDate, bodyAreas]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        horseId: { type: string, format: uuid }
        visitDate: { type: string, format: date }
        contactName: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        bodyAreas: { type: string }
        cost: { type: [number, "null"] }
        nextVisitDate: { type: [string, "null"], format: date }
    SpecialistVisitListItem:
      type: object
      required: [id, version, horseId, visitDate, specialistTypeId, specialistTypeName]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        horseId: { type: string, format: uuid }
        visitDate: { type: string, format: date }
        specialistTypeId: { type: string, format: uuid }
        specialistTypeName: { type: string }
        contactName: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        cost: { type: [number, "null"] }
        nextVisitDate: { type: [string, "null"], format: date }
    CompetitionListItem:
      type: object
      required: [id, version, name, dateFrom, startsCount]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        name: { type: string }
        dateFrom: { type: string, format: date }
        dateTo: { type: [string, "null"], format: date }
        city: { type: [string, "null"] }
        venue: { type: [string, "null"] }
        rankName: { type: [string, "null"] }
        disciplineName: { type: [string, "null"] }
        startsCount: { type: integer }
        bestPlacement: { type: [integer, "null"] }
    PurchaseListItem:
      type: object
      required: [id, version, purchaseDate, productName, categoryName, assignment, horseNames, totalAmount]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        purchaseDate: { type: string, format: date }
        productName: { type: string }
        categoryName: { type: string }
        supplierName: { type: [string, "null"] }
        assignment: { $ref: "#/components/schemas/PurchaseAssignment" }
        horseNames: { type: string }
        totalAmount: { type: number }
        deliveryCost: { type: number }
        totalCost: { type: number }

    # ---- dictionaries ----
    DictionaryItemInput:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 100 }
        sortOrder: { type: integer }
        isActive: { type: boolean, default: true }
    DictionaryItem:
      allOf:
        - $ref: "#/components/schemas/DictionaryItemInput"
        - type: object
          required: [id, version, type, value, sortOrder, isActive, isSystem]
          properties:
            id: { type: string, format: uuid, readOnly: true }
            version: { type: integer, readOnly: true }
            type: { $ref: "#/components/schemas/DictionaryType" }
            isSystem: { type: boolean, readOnly: true }
            systemKey: { type: [string, "null"], readOnly: true }

    # ---- attachments ----
    Attachment:
      type: object
      required: [id, ownerType, ownerId, fileName, contentType, sizeBytes, sha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerType: { $ref: "#/components/schemas/AttachmentOwnerType" }
        ownerId: { type: string, format: uuid }
        horseId: { type: [string, "null"], format: uuid }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        description: { type: [string, "null"] }
        hasThumbnail: { type: boolean }
        fileAvailable:
          type: boolean
          description: false, gdy plik nie istnieje w magazynie (np. po imporcie JSON bez załączników); /content i /thumbnail zwracają wtedy 404
        createdAt: { type: string, format: date-time }

    # ---- reports ----
    CostReportRow:
      type: object
      properties:
        group: { type: string, description: "Koń / miesiąc (yyyy-MM) / kategoria — zależnie od groupBy" }
        horseId: { type: [string, "null"], format: uuid }
        category: { type: [string, "null"] }
        month: { type: [string, "null"], pattern: "^\\d{4}-\\d{2}$" }
        costs: { type: number }
        income: { type: number }
    CostReport:
      type: object
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        groupBy: { type: string }
        rows: { type: array, items: { $ref: "#/components/schemas/CostReportRow" } }
        generalPurchasesTotal: { type: number, description: Zakupy ogólne (stajnia) }
        totalCosts: { type: number }
        totalIncome: { type: number }
        balance: { type: number }

    HorseBalanceBreakdown:
      type: object
      properties:
        year: { type: integer }
        category: { type: string }
        costs: { type: number }
    HorseBalanceRow:
      type: object
      properties:
        horseId: { type: string, format: uuid }
        horseName: { type: string }
        status: { $ref: "#/components/schemas/HorseStatus" }
        purchasePrice: { type: [number, "null"] }
        costs: { type: number, description: Koszty konia z całej historii (te same reguły co raport kosztów) }
        prizes: { type: number, description: Nagrody z zawodów }
        salePrice: { type: [number, "null"], description: Cena efektywna — dla konia Deceased bez wpisanej ceny 0 }
        estimatedValue: { type: [number, "null"], description: Ocena własna właściciela; nie wchodzi do wyniku }
        result: { type: number }
        isFinal: { type: boolean, description: false = wynik dotychczasowy (koń niesprzedany) }
        purchaseMissing: { type: boolean }
        breakdown: { type: array, items: { $ref: "#/components/schemas/HorseBalanceBreakdown" } }
    HorseBalanceTotals:
      type: object
      properties:
        purchasePrice: { type: number }
        costs: { type: number }
        prizes: { type: number }
        salePrice: { type: number }
        result: { type: number }
    HorseBalanceReport:
      type: object
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/HorseBalanceRow" } }
        totals: { $ref: "#/components/schemas/HorseBalanceTotals" }
    TrainingStat:
      type: object
      properties:
        min: { type: number }
        average: { type: number, description: Jedno miejsce po przecinku }
        max: { type: number }
    TrainingSummaryRow:
      type: object
      properties:
        typeId: { type: [string, "null"], format: uuid }
        typeName: { type: string }
        paletteIndex: { type: integer }
        count: { type: integer }
        totalMinutes: { type: integer }
        totalCost: { type: number, description: Suma kosztów treningów rodzaju w okresie (od 1.4) }
        duration: { oneOf: [{ $ref: "#/components/schemas/TrainingStat" }, { type: "null" }] }
        intensity: { oneOf: [{ $ref: "#/components/schemas/TrainingStat" }, { type: "null" }], description: Skala 1–3 (Light = 1, Medium = 2, Hard = 3) }
        rating: { oneOf: [{ $ref: "#/components/schemas/TrainingStat" }, { type: "null" }] }
        obstacleHeight: { oneOf: [{ $ref: "#/components/schemas/TrainingStat" }, { type: "null" }], description: Tylko dla rodzaju systemowego Skoki }
    TrainingSeriesPoint:
      type: object
      properties:
        date: { type: string, format: date }
        value: { type: number }
    TrainingSeries:
      type: object
      properties:
        parameter: { type: string, enum: [Duration, Rating, ObstacleHeight] }
        typeId: { type: string, format: uuid }
        points: { type: array, items: { $ref: "#/components/schemas/TrainingSeriesPoint" } }
    TrainingSummaryReport:
      type: object
      properties:
        horseId: { type: string, format: uuid }
        horseName: { type: string }
        range: { type: string, enum: [week, month, year, all] }
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        rows: { type: array, items: { $ref: "#/components/schemas/TrainingSummaryRow" } }
        total: { $ref: "#/components/schemas/TrainingSummaryRow" }
        series: { type: array, items: { $ref: "#/components/schemas/TrainingSeries" } }
    RiderTrainingsRow:
      type: object
      properties:
        trainingId: { type: string, format: uuid }
        date: { type: string, format: date }
        horseId: { type: string, format: uuid }
        horseName: { type: string }
        typeName: { type: string }
        durationMinutes: { type: [integer, "null"] }
        intensity: { oneOf: [{ $ref: "#/components/schemas/TrainingIntensity" }, { type: "null" }] }
        rating: { type: [integer, "null"] }
        trainerName: { type: [string, "null"] }
        cost: { type: [number, "null"] }
        riderContactId: { type: string, format: uuid }
        riderName: { type: string }
    RiderTrainingsTotals:
      type: object
      properties:
        count: { type: integer }
        totalMinutes: { type: integer }
        averageRating: { type: [number, "null"], description: Średnia z treningów z oceną; null, gdy brak ocen }
        totalCost: { type: number, description: Suma kosztów treningów z kosztem }
    RiderTrainingsGroup:
      allOf:
        - type: object
          properties:
            key: { type: string, format: uuid, description: horseId (jeden jeździec) albo riderContactId (wszyscy) }
            name: { type: string }
        - $ref: "#/components/schemas/RiderTrainingsTotals"
    RiderTrainingsReport:
      type: object
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        riderContactId: { type: [string, "null"], format: uuid, description: Jeździec raportu; null = wszyscy jeźdźcy }
        riderName: { type: [string, "null"] }
        rows: { type: array, items: { $ref: "#/components/schemas/RiderTrainingsRow" } }
        total: { $ref: "#/components/schemas/RiderTrainingsTotals" }
        groups: { type: array, items: { $ref: "#/components/schemas/RiderTrainingsGroup" } }
        groupedBy: { type: string, enum: [Horse, Rider] }
    RiderCompetitionStartRow:
      type: object
      properties:
        startId: { type: string, format: uuid }
        date: { type: string, format: date }
        horseId: { type: string, format: uuid }
        horseName: { type: string }
        disciplineName: { type: [string, "null"] }
        className: { type: [string, "null"] }
        resultStatus: { $ref: "#/components/schemas/ResultStatus" }
        placement: { type: [integer, "null"] }
        participantsCount: { type: [integer, "null"] }
        entryFee: { type: [number, "null"] }
        otherCosts: { type: [number, "null"] }
        prizeMoney: { type: [number, "null"] }
        riderContactId: { type: string, format: uuid }
        riderName: { type: string }
    RiderCompetitionRow:
      type: object
      properties:
        competitionId: { type: string, format: uuid }
        name: { type: string }
        dateFrom: { type: string, format: date }
        dateTo: { type: [string, "null"], format: date }
        city: { type: [string, "null"] }
        starts: { type: array, items: { $ref: "#/components/schemas/RiderCompetitionStartRow" } }
    RiderCompetitionsTotals:
      type: object
      properties:
        competitions: { type: integer, description: Zawody liczone raz }
        starts: { type: integer }
        totalCosts: { type: number }
        totalPrizes: { type: number }
        balance: { type: number, description: totalPrizes − totalCosts }
    RiderCompetitionsGroup:
      allOf:
        - type: object
          properties:
            riderContactId: { type: string, format: uuid }
            riderName: { type: string }
        - $ref: "#/components/schemas/RiderCompetitionsTotals"
    RiderCompetitionsReport:
      type: object
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        riderContactId: { type: [string, "null"], format: uuid, description: Jeździec raportu; null = wszyscy jeźdźcy }
        riderName: { type: [string, "null"] }
        competitions: { type: array, items: { $ref: "#/components/schemas/RiderCompetitionRow" } }
        total: { $ref: "#/components/schemas/RiderCompetitionsTotals" }
        groups: { type: array, items: { $ref: "#/components/schemas/RiderCompetitionsGroup" }, description: Tylko dla wszystkich jeźdźców; pusta dla jednego }

    # ---- trash ----
    TrashItem:
      type: object
      properties:
        type: { type: string }
        id: { type: string, format: uuid }
        description: { type: string }
        horseName: { type: [string, "null"] }
        deletedAt: { type: string, format: date-time }
        dependentCount: { type: integer, description: Liczba rekordów zależnych w batchu }
        rootVersion:
          type: integer
          description: >
            Od 2.0. Aktualna wersja korzenia partii (do `If-Match` przy `POST /trash/{type}/{id}/restore`). Przy `409` w odpowiedzi
            na przywracanie towarzyszy jej nagłówek `ETag: "<rootVersion>"`.
