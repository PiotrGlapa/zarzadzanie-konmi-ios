# Kopia kontraktu programu 2.0.0 (zasada V) z poprawkami kształtów list i słownika jak w kontrakcie 1.6.1 aplikacji (programowy plik opisuje je inaczej niż program odpowiada).
openapi: 3.1.0
info:
  title: Horsely – Zarządzanie Koniem, Trening i Budżet — API
  version: "2.0.0"
  description: |
    REST API aplikacji desktopowej „Horsely – Zarządzanie Koniem, Trening i Budżet” (do 1.6.1 „Zarządzanie końmi”), dostępne w sieci lokalnej.
    Zasady ogólne: SPECYFIKACJA.md sekcja 7. Wszystkie endpointy (poza oznaczonymi `security: []`)
    wymagają nagłówka `X-Api-Key`.

    Konwencje:
    - `DateOnly` → `format: date` (`2026-09-28`), `DateTime` lokalny → `format: date-time` bez strefy.
    - Kwoty w PLN jako liczby z maks. 2 miejscami po przecinku.
    - `PUT` wymaga `version` (w treści) lub nagłówka `If-Match`; niezgodność → 409 z aktualnym rekordem.
    - `DELETE` = miękkie usunięcie (do kosza); od 2.0 opcjonalnie z `If-Match`.

    **Dostęp spoza sieci domowej (od 1.2).** Domyślnie API przyjmuje tylko połączenia z adresów lokalnych
    (10/8, 172.16/12, 192.168/16, 127/8, 169.254/16, `::1`, `fc00::/7`, `fe80::/10`). Po włączeniu trybu „Dostęp spoza
    sieci domowej” (tylko HTTPS, TLS ≥ 1.2) z internetu działają wyłącznie klucze ze zgodą na dostęp zdalny.
    Dla adresów zdalnych: `/system/info` wymaga klucza; `/docs` i `/openapi/*` zwracają `404`; 10 nieudanych prób
    uwierzytelnienia w 10 minut blokuje adres na 1 h (kolejne blokady w ciągu 24 h — 2×, maks. 7 dni) — odpowiedź `429`
    z `Retry-After`; żądania bez klucza — limit 10/min na adres. Przy wyłączonym trybie żądania z adresów zdalnych
    dostają `403` bez treści, a ścieżki spoza `/api/v1` — `404`. Odpowiedzi `401`/`429` dla klientów z internetu bez
    ważnego klucza mają neutralną treść problemu (bez typu specyficznego dla programu). Klienci MUST NOT wysyłać żądań bez klucza
    ani ponawiać odrzuconych żądań w pętli.

    **Nowości 1.3.** Zasób `/trainings` (dziennik treningów), pola finansowe konia w obiekcie `finance`
    (zakup, sprzedaż, wartość — ocena własna właściciela), słownik `TrainingType` oraz raporty `/reports/horse-balance`
    („Bilans konia”) i `/reports/training-summary` („Podsumowanie treningów”). Zmiany są addytywne: klient 1.2, który
    zapisuje konia bez `finance`, nie zmienia wpisanych kwot. Zmiana statusu konia na `Deceased` ustawia
    `finance.salePrice = 0`.

    **Nowości 1.4.** Typ kontaktu `Trainer`, trener i koszt treningu w obiekcie `coaching` (`PUT /trainings/{id}` bez
    `coaching` zachowuje trenera i koszt), filtr `trainerId` oraz `totalCost` w `GET /trainings`, `totalCost` w wierszach
    `/reports/training-summary` i kategoria „Treningi” w raportach kosztów i bilansie konia. Zmiany są addytywne.

    **Nowości 1.5.** Typ kontaktu `Rider`, raporty `/reports/rider-trainings` („Treningi jeźdźca”) i
    `/reports/rider-competitions` („Zawody jeźdźca”), `409 InUse` przy usuwaniu kontaktu będącego jeźdźcem treningu lub
    startu.

    **Breaking 1.5.0 (jednorazowy wyjątek zasady zgodności wstecznej, konstytucja 1.1.0).** Jeździec treningu i startu
    w zawodach jest kontaktem, nie tekstem: `rider` (tekst) w `TrainingInput`, `Training`, `CompetitionStartInput`
    i `CompetitionStart` zastępuje `riderContactId` (kontakt typu `Rider`) z polem `riderName` tylko do odczytu, a parametr
    `rider` listy `GET /trainings` — parametr `riderId`. Pole `rider` wysłane w żądaniu jest ignorowane jak każde nieznane
    pole. Błędy walidacji (400 z polem `riderContactId` w `errors`, jak dla trenera): kontakt nie istnieje albo jest w koszu, kontakt nie ma typu `Rider`. Żadne inne pole ani operacja nie zmienia nazwy
    ani znaczenia.
    **Nowości 2.0.** Wszystkie zmiany są addytywne w `/api/v1`: klient 1.x i aplikacja mobilna 2.0.0 (bez nowych nagłówków i parametrów)
    dostają odpowiedzi jak w 1.6.1. Nazwy możliwości i nagłówków są kontraktem z aplikacją mobilną.
    - `GET /system/info` zwraca `capabilities` (`updatedSince`, `ifMatchDelete`, `idempotencyKey`, `horsePhotoField`, `dataStamp`,
      `horseStatusInjured`) i `dataStamp` (16 znaków szesnastkowych; zmienia się po każdej zmianie danych).
    - `GET /export?scope=full&updatedSince=…` — eksport przyrostowy w schemacie 1.5 (`export-schema-1.5.json`): zmienione rekordy,
      `trashed[]`, `purged[]`, `scope.nextUpdatedSince`, `scope.fullRequired`. Bez `updatedSince` i bez nagłówka `X-Client-Features: horse-status-injured`
      eksport pozostaje w schemacie 1.4 bez zmian. Odpowiedź jest strumieniowana; błędne parametry kończą się `400` przed pierwszym bajtem.
    - `If-Match` przy każdym `DELETE` i przy `POST /trash/{type}/{id}/restore`: niezgodna wersja → `409` z aktualnym rekordem, rekord nietknięty.
    - `Idempotency-Key` przy `POST` tworzących: powtórzenie z tą samą treścią → zapamiętana odpowiedź i `Idempotent-Replayed: true`
      (bez nowego rekordu); inna treść → `422` (`…/idempotency-key-reused`); w toku → `409` (`…/idempotency-key-in-progress`). Zapamiętanie na 7 dni.
    - `photoAttachmentId` w `PUT /horses/{id}`: brak pola = bez zmiany, `null` = brak zdjęcia, identyfikator = ustaw zdjęcie.
    - Status konia `Injured` („Kontuzjowany”) widzą tylko klienci z nagłówkiem `X-Client-Features: horse-status-injured`; pozostali widzą `Active`
      i nie zmienią statusu `Injured` zapisem `Active`.
    - Dziennik żądań zawiera adres IP połączenia (tylko lokalnie, retencja 30 dni).
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host: { default: 192.168.1.10 }
      port: { default: "5080" }
  - url: https://{publicHost}:{publicPort}/api/v1
    description: Adres publiczny (DynDNS albo stały publiczny IP) — tylko przy włączonym dostępie spoza sieci domowej
    variables:
      publicHost: { default: stajnia.dyndns.org }
      publicPort: { default: "48123" }
security:
  - ApiKey: []

tags:
  - name: System
  - name: Horses
  - name: VetVisits
  - name: FarrierVisits
  - name: PhysioVisits
  - name: SpecialistVisits
  - name: Competitions
  - name: Purchases
  - name: Notes
  - name: Trainings
  - name: Reminders
  - name: Contacts
  - name: Dictionaries
  - name: Attachments
  - name: Reports
  - name: Export
  - name: Trash

paths:
  /system/info:
    get:
      tags: [System]
      summary: Informacje o serwerze (test połączenia)
      description: >
        Z sieci lokalnej bez klucza (jak w 1.0/1.1). Z adresu zdalnego wymaga klucza (`401` bez klucza) — od 1.2.
        Od 2.0 zawiera `capabilities` i `dataStamp`.
      security: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }

  /dashboard:
    parameters: [{ $ref: "#/components/parameters/ClientFeatures" }]
    get:
      tags: [Reminders]
      summary: Dane pulpitu (FR-PUL-01)
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- Horses ----------------
  /horses:
    parameters: [{ $ref: "#/components/parameters/ClientFeatures" }]
    get:
      tags: [Horses]
      summary: Lista koni
      parameters:
        - name: status
          in: query
          description: >
            Brak = konie w stajni (`Active` + `Injured`, od 2.0; do 1.6.1 tylko `Active`); `all` = wszystkie.
            Klient z `X-Client-Features: horse-status-injured`: `Active` = tylko aktywne, `Injured` = tylko kontuzjowane.
            Klient bez tej cechy: `Active` zwraca konie aktywne i kontuzjowane (te drugie jako `Active`).
          schema: { type: string, enum: [Active, Injured, Sold, Deceased, Leased, all] }
        - name: foal
          in: query
          description: true = tylko źrebięta; false = bez źrebiąt; brak = wszystkie (w ramach filtra status) — od 1.1
          schema: { type: boolean }
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HorsePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Horses]
      summary: Dodanie konia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HorseInput" }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "201": { $ref: "#/components/responses/HorseCreated" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
  /horses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/ClientFeatures" }]
    get:
      tags: [Horses]
      summary: Szczegóły konia
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Horse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Horses]
      summary: Aktualizacja konia
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HorseUpdate" }
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Horse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Horses]
      summary: Usunięcie konia do kosza (wraz z wpisami)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204": { description: Usunięto }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /horses/{id}/timeline:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Horses]
      summary: Oś czasu konia (FR-WYS-01)
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: types
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/TimelineEntryType" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimelinePage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /horses/{id}/photo:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Horses]
      summary: Zdjęcie główne konia
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Plik obrazu
          content:
            image/*: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /horses/{id}/stats/competitions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Horses, Competitions]
      summary: Statystyki startów konia (FR-ZAW-05)
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: disciplineId, in: query, schema: { type: string, format: uuid } }
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetitionStats" }
  /horses/{id}/farrier-next-date:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Horses, FarrierVisits]
      summary: Podpowiedź daty następnej wizyty kowala (FR-KOW-02)
      parameters:
        - { name: visitDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nextVisitDate, intervalWeeks]
                properties:
                  nextVisitDate: { type: string, format: date }
                  intervalWeeks: { type: integer }

  # ---------------- Visits ----------------
  /vet-visits:
    get:
      tags: [VetVisits]
      summary: Lista wizyt weterynaryjnych
      parameters:
        - $ref: "#/components/parameters/HorseId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: visitTypeId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/VetVisitListItem" } }
    post:
      tags: [VetVisits]
      summary: Dodanie wizyty weterynaryjnej
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VetVisitInput" }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "201":
          description: Utworzono
          headers: { Location: { $ref: "#/components/headers/Location" }, Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VetVisit" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
  /vet-visits/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [VetVisits]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VetVisit" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [VetVisits]
      description: Kolekcja `medications` zastępowana w całości.
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VetVisitInput"
                - $ref: "#/components/schemas/VersionField"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VetVisit" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [VetVisits]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204": { description: Usunięto }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /farrier-visits:
    get:
      tags: [FarrierVisits]
      parameters:
        - $ref: "#/components/parameters/HorseId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Sort"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/FarrierVisitListItem" } }
    post:
      tags: [FarrierVisits]
      description: Serwer nie wylicza `nextVisitDate` — użyj `/horses/{id}/farrier-next-date`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarrierVisitInput" }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "201":
          description: Utworzono
          headers: { Location: { $ref: "#/components/headers/Location" }, Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarrierVisit" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
  /farrier-visits/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [FarrierVisits]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarrierVisit" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [FarrierVisits]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FarrierVisitInput"
                - $ref: "#/components/schemas/VersionField"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarrierVisit" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [FarrierVisits]
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "204": { description: Usunięto }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /physio-visits:
    get:
      tags: [PhysioVisits]
      parameters:
        - $ref: "#/components/parameters/HorseId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "403": { $ref: "#/components/responses/KeyHomeOnly" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/PhysioVisitListItem" } }
    post:
      tags: [PhysioVisits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhysioVisitInput" }
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
